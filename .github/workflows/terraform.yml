name: Terraform Bootstrap

on:
  pull_request:
    branches: [develop, main]
    paths: ["bootstrap/**"]
  push:
    branches: [develop, main]
    paths: ["bootstrap/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options: [dev, prod]

env:
  TF_VERSION: "1.10.0"
  WORKING_DIR: bootstrap
  AWS_REGION: us-east-1

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Versión de Terraform
        run: |
          echo "📦 Terraform version: $(terraform version -json | jq -r '.terraform_version')"
          echo "📂 Directorio de trabajo: ${{ env.WORKING_DIR }}"

      - name: Format check
        run: |
          echo "🔍 Verificando formato del código..."
          terraform fmt -check -recursive
          echo "✅ Formato correcto"
        working-directory: ${{ env.WORKING_DIR }}

      - name: Init (sin backend remoto)
        run: |
          echo "⚙️  Inicializando Terraform sin backend remoto..."
          terraform init -backend=false
          echo "✅ Init completado"
        working-directory: ${{ env.WORKING_DIR }}

      - name: Validate
        run: |
          echo "🔎 Validando configuración de Terraform..."
          terraform validate
          echo "✅ Configuración válida"
        working-directory: ${{ env.WORKING_DIR }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Checkov
        run: echo "🛡️  Ejecutando análisis de seguridad con Checkov..."

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.WORKING_DIR }}
          framework: terraform
          soft_fail: true

  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: [validate, security]
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Contexto del PR
        run: |
          echo "📋 PR:       #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}"
          echo "👤 Autor:    ${{ github.actor }}"
          echo "🌿 Rama:     ${{ github.head_ref }} → ${{ github.base_ref }}"
          echo "🌍 Ambiente: ${{ github.base_ref == 'main' && 'prod' || 'dev' }}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ github.base_ref == 'main' && secrets.AWS_ROLE_ARN_PROD || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Cuenta AWS
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "🔐 AWS Account ID: $ACCOUNT_ID"
          echo "🌎 AWS Region:     ${{ env.AWS_REGION }}"

      - name: Init
        run: |
          echo "⚙️  Inicializando Terraform..."
          terraform init
          echo "✅ Init completado"
        working-directory: ${{ env.WORKING_DIR }}

      - name: Plan
        id: plan
        run: |
          echo "🗺️  Generando plan de Terraform..."
          terraform plan \
            -var="environment=${{ github.base_ref == 'main' && 'prod' || 'dev' }}" \
            -no-color \
            -out=tfplan 2>&1 | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
          echo "✅ Plan generado"
        working-directory: ${{ env.WORKING_DIR }}

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n... (truncado)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `#### Terraform Plan 📋 \`${{ github.base_ref == 'main' && 'prod' || 'dev' }}\`\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    environment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Contexto del despliegue
        run: |
          echo "👤 Iniciado por: ${{ github.actor }}"
          echo "🌿 Rama:         ${{ github.ref_name }}"
          echo "🌍 Ambiente:     ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}"
          echo "⚡ Trigger:      ${{ github.event_name }}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ (github.event.inputs.environment == 'prod' || github.ref == 'refs/heads/main') && secrets.AWS_ROLE_ARN_PROD || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Cuenta AWS
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "🔐 AWS Account ID: $ACCOUNT_ID"
          echo "🌎 AWS Region:     ${{ env.AWS_REGION }}"

      - name: 🚀 Despliegue a demanda
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "::notice title=🚀 Despliegue a demanda::Iniciado manualmente por ${{ github.actor }} para el ambiente ${{ github.event.inputs.environment }}"

      - name: Init
        run: |
          echo "⚙️  Inicializando Terraform..."
          terraform init
          echo "✅ Init completado"
        working-directory: ${{ env.WORKING_DIR }}

      - name: Apply
        run: |
          echo "🚀 Aplicando cambios en ambiente: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}..."
          terraform apply \
            -var="environment=${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}" \
            -auto-approve
          echo "✅ Apply completado exitosamente"
        working-directory: ${{ env.WORKING_DIR }}
